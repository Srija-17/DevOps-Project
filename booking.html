<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Haven Hotel - Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-auth-required="true">
  <nav>
    <div class="container">
      <a href="index.html">Landing</a>
      <a href="rooms.html">Rooms & Pricing</a>
      <a href="booking.html">Booking</a>
      <a href="auth.html">Authentication</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <main class="container">
    <section class="card">
      <h1>Booking Page</h1>
      <p class="muted">Reserve your room in one step.</p>
      <form id="bookingForm">
        <label>
          Full Name
          <input id="guestName" type="text" required />
        </label>
        <label>
          Room Type
          <select id="roomType" required>
            <option value="Standard Room">Standard Room - $120/night</option>
            <option value="Deluxe Room">Deluxe Room - $180/night</option>
            <option value="Executive Suite">Executive Suite - $260/night</option>
          </select>
        </label>
        <label>
          Check-in Date
          <input id="checkIn" type="date" required />
        </label>
        <label>
          Check-out Date
          <input id="checkOut" type="date" required />
        </label>
        <button type="submit">Confirm Booking</button>
      </form>
      <p id="bookingMessage" class="message" role="alert" aria-live="assertive"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
