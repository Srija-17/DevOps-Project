<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Haven Hotel - Authentication</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-demo-auth="true">
  <main class="container">
    <section class="card">
      <h1>Authentication Page</h1>
      <p class="muted"><strong>Demo only (not production-ready):</strong> sign in with any username and password to access UI pages.</p>
      <form id="authForm">
        <label>
          Username
          <input id="username" name="username" type="text" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required />
        </label>
        <button type="submit">Login</button>
      </form>
      <p id="authStatus" class="message" role="alert" aria-live="assertive"></p>
      <p class="muted">Demo mode: this page uses client-side authentication for UI access.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
