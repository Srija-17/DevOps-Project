<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Haven Hotel - Authentication</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Authentication Page</h1>
      <p class="muted">Sign in to access the hotel management system.</p>
      <form id="authForm">
        <label>
          Username
          <input id="username" name="username" type="text" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required />
        </label>
        <button type="submit">Login</button>
      </form>
      <p id="authStatus" class="message"></p>
      <p class="muted">Demo credentials: <strong>admin</strong> / <strong>hotel123</strong></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
